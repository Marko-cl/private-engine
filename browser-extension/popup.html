<!doctype html><html><head><meta charset="utf-8"><title>Private Context Engine</title><style>body{font:14px system-ui,sans-serif;width:280px;padding:16px;color:#17202b}h1{font-size:16px;margin:0 0 12px}.row{margin:8px 0}.muted{color:#667085;font-size:12px}button{padding:7px 10px;margin:4px 4px 0 0;border:1px solid #ccd3dc;border-radius:6px;background:#fff;cursor:pointer}.status{font-weight:600}.danger{color:#a3263d}</style></head><body><h1>Private Context Engine</h1><div class="row">Status: <span id="status" class="status">Checking…</span></div><div class="row">Browser context: <label><input id="enabled" type="checkbox"> On</label></div><div class="row">Current domain: <span id="domain">—</span></div><div class="row">Last accepted: <span id="accepted">—</span></div><button id="pair">Pair with desktop</button><p class="muted">Only the active tab's domain, title, URL, time, and duration are sent. Page contents, cookies, passwords, and history are never collected.</p><script src="popup.js"></script></body></html>
